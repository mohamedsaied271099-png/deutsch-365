<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deutsch 365</title>
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">🇩🇪 Deutsch 365</div>
    <div class="stats">
      <span title="أيام متتالية">🔥 <b id="streak">0</b></span>
      <span title="نقاط الخبرة">⭐ <b id="xp">0</b></span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="today" class="active">📅<span>النهارده</span></button>
    <button data-tab="plan">🗺️<span>الخطة</span></button>
    <button data-tab="cards">🧠<span>البطاقات</span></button>
    <button data-tab="tutor">🤖<span>المدرس</span></button>
    <button data-tab="settings">⚙️<span>الإعدادات</span></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
